<style>
:root{--bg:#10141a;--card:#1a2029;--fg:#eef2f6;--mut:#94a3b8;--acc:#4f9cf9;--ok:#34c38f;--bad:#f46a6a;--warn:#f1b44c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:20px;margin:4px 0 2px}
.sub{color:var(--mut);font-size:13px;margin-bottom:14px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font:inherit;border:0;border-radius:12px;padding:12px 14px;background:#2a3340;color:var(--fg)}
button.big{width:100%;padding:22px;font-size:22px;font-weight:700;background:var(--acc);color:#fff;border-radius:16px}
button.stop{background:var(--bad)}
.day{flex:1;text-align:center;font-weight:600}
.ptype{color:var(--acc);font-size:13px;font-weight:600;margin-bottom:4px}

#status{font-size:18px;font-weight:600;min-height:28px}

details summary{color:var(--mut);font-size:14px;cursor:pointer}
#log{font-size:13px;color:var(--mut);line-height:1.6;margin-top:6px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;background:#2a3340;font-size:12px;margin-right:4px}
#tapAll{position:fixed;inset:0;background:rgba(16,20,26,.96);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:9;font-size:30px;font-weight:800;color:#fff;text-align:center}
#tapAll small{font-size:16px;color:#94a3b8;font-weight:400;margin-top:12px}

    fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(j=>{
      if(j && j.v>APP_VER && sessionStorage.getItem('reloadedFor')!==String(j.v)){
        sessionStorage.setItem('reloadedFor',String(j.v));
        const auto=/[?&]auto=1/.test(location.search);
        location.replace(location.pathname+'?'+(auto?'auto=1&':'')+'r='+Date.now());
      }
    }).catch(()=>{});
  }catch(e){}

<script type="module">
// In-browser speech recognition (Whisper) so one mic stream gives both words and pitch.
window.asrState='loading';
try{
  const T=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1');
  T.env.allowLocalModels=false;
  const onP=p=>{ if(p.status==='progress'&&p.total){ window.asrProgress=Math.round(p.loaded/p.total*100); const el=document.getElementById('asrInfo'); if(el) el.textContent='음성인식 모델 받는 중… '+window.asrProgress+'% (처음 한 번만, 와이파이 권장)'; } };
  let pipe=null;
  try{ if(navigator.gpu) pipe=await T.pipeline('automatic-speech-recognition','Xenova/whisper-base.en',{device:'webgpu',dtype:{encoder_model:'fp32',decoder_model_merged:'q4'},progress_callback:onP}); }catch(e){ pipe=null; }
  if(!pipe) pipe=await T.pipeline('automatic-speech-recognition','Xenova/whisper-base.en',{dtype:'q8',progress_callback:onP});
  window.asrPipe=pipe; window.asrState='ready';
  const el=document.getElementById('asrInfo'); if(el) el.textContent='음성인식 준비 완료 (한 번 읽으면 단어+억양 동시 평가)';
}catch(e){ window.asrState='failed'; const el=document.getElementById('asrInfo'); if(el) el.textContent='음성인식 모델을 못 받았어요. 크롬 음성인식으로 진행해요 (억양은 한 번 더 읽기)'; console.error(e); }
</script>
<script src="passages.js?v=13"></script>
<script src="vocab.js?v=13"></script>
<script src="core.js?v=13"></script>
<script>
const $=id=>document.getElementById(id);
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let dayOffset=0, running=false, stopFlag=false, wakeLock=null;
let audioCtx=null, micCtx=null, stream=null, analyser=null, buf=null, sampler=null, frames=[], t0=0;
let pitchMode=/Android/i.test(navigator.userAgent)?'sequential':'concurrent';
const hardWords={}; const logLines=[];

function seoulToday(){ return new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Seoul'})); }
function dayIndex(){ const s=new Date(START_DATE+'T00:00:00'); const d=seoulToday(); d.setHours(0,0,0,0); return Math.round((d-s)/86400000)+dayOffset; }
function todaysPassages(){
  const c=$('custom').value.trim();
  if(c) return c.split(/\n\s*\n/).map((t,i)=>({type:'붙여넣은 지문 '+(i+1),text:t.replace(/\s+/g,' ').trim()})).filter(p=>p.text);
  const n=PASSAGES.length, k=((dayIndex()*2)%n+n)%n;
  return [PASSAGES[k], PASSAGES[(k+1)%n]];
}
function renderDay(){
  const d=seoulToday(); d.setDate(d.getDate()+dayOffset);
  $('dayLabel').textContent=(dayOffset===0?'오늘 ':'')+(d.getMonth()+1)+'월 '+d.getDate()+'일 '+(mode==='vocab'?'표현':'지문');
  if(mode==='vocab') renderVocab(); else renderPassages();
}
function renderPassages(active){
  const ps=todaysPassages();
  $('passageBox').innerHTML=ps.map((p,pi)=>{
    const ss=Core.splitSentences(p.text);
    return `<div style="margin-bottom:10px"><div class="ptype">지문 ${pi+1} · ${p.type}</div><div class="ptext">`+
      ss.map((s,si)=>{ let cls=''; if(active){ if(pi<active.p||(pi===active.p&&si<active.s)) cls='done'; else if(pi===active.p&&si===active.s) cls='cur'; }
        return `<span class="${cls}">${s}</span>`; }).join(' ')+`</div></div>`;
  }).join('');
}
$('prevDay').onclick=()=>{ if(!running){dayOffset--;renderDay();} };
$('nextDay').onclick=()=>{ if(!running){dayOffset++;renderDay();} };
$('custom').oninput=()=>renderPassages();

// ---------- speech output ----------
let voices=[];
function loadVoices(){ voices=speechSynthesis.getVoices(); }
loadVoices(); speechSynthesis.onvoiceschanged=loadVoices;
function pickVoice(lang){
  const L=voices.filter(v=>v.lang&&v.lang.replace('_','-').toLowerCase().startsWith(lang));
  return L.find(v=>/google/i.test(v.name))||L[0]||null;
}
function say(text,lang='ko',rate){
  return new Promise(res=>{
    if(stopFlag) return res();
    const u=new SpeechSynthesisUtterance(text);
    u.lang= lang==='en'?'en-US':'ko-KR'; const v=pickVoice(lang==='en'?'en-us':'ko'); if(v) u.voice=v;
    u.volume=1; u.rate= rate || (lang==='en'? parseFloat($('rate').value) : 1.05);
    let done=false; const fin=()=>{ if(!done){done=true;res();} };
    u.onend=fin; u.onerror=fin; setTimeout(fin, 2000+text.length*160);
    speechSynthesis.speak(u);
  });
}
// mixed: [['ko','...'],['en','word']]
async function sayParts(parts){ for(const [l,t] of parts){ if(stopFlag) return; await say(t,l, l==='en'?0.8:undefined); } }
function beep(f=880,d=0.12){
  try{ const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.frequency.value=f; g.gain.value=0.15;
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+d); }catch(e){}
  return new Promise(r=>setTimeout(r,d*1000+60));
}

// ---------- mic / pitch ----------
async function openMic(){
  if(stream){ const t=stream.getAudioTracks()[0]; if(t && t.readyState==='live' && t.enabled && !t.muted) return true; closeMic(); }
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    micCtx=new (window.AudioContext||window.webkitAudioContext)(); await micCtx.resume();
    const src=micCtx.createMediaStreamSource(stream);
    analyser=micCtx.createAnalyser(); analyser.fftSize=2048; src.connect(analyser);
    buf=new Float32Array(analyser.fftSize); return true;
  }catch(e){ stream=null; return false; }
}
function closeMic(){ if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; analyser=null; } if(micCtx){ try{micCtx.close();}catch(e){} micCtx=null; } }
function detectPitch(b,sr){
  let rms=0; for(let i=0;i<b.length;i++) rms+=b[i]*b[i]; rms=Math.sqrt(rms/b.length);
  if(rms<0.008) return {rms,f0:0};
  const minL=Math.floor(sr/400), maxL=Math.floor(sr/75); const N=b.length-maxL;
  let best=-1,bestL=0; const corr=new Float32Array(maxL+1);
  for(let L=minL;L<=maxL;L++){ let s=0,e1=0,e2=0; for(let i=0;i<N;i+=2){ s+=b[i]*b[i+L]; e1+=b[i]*b[i]; e2+=b[i+L]*b[i+L]; }
    const c=s/Math.sqrt(e1*e2+1e-9); corr[L]=c; if(c>best){best=c;bestL=L;} }
  if(best<0.5) return {rms,f0:0};
  // prefer the first strong peak (avoid octave errors)
  for(let L=minL;L<bestL;L++){ if(corr[L]>best*0.9 && corr[L]>=corr[L-1] && corr[L]>=corr[L+1]){ bestL=L; break; } }
  return {rms, f0: sr/bestL};
}
function startSampling(){
  frames=[]; t0=performance.now();
  sampler=setInterval(()=>{
    if(!analyser) return;
    analyser.getFloatTimeDomainData(buf);
    const p=detectPitch(buf,micCtx.sampleRate);
    frames.push({t:(performance.now()-t0)/1000, rms:p.rms, f0:p.f0});
    $('lvl').style.width=Math.min(100,Math.sqrt(p.rms)*300)+'%';
  },20);
}
function stopSampling(){ clearInterval(sampler); sampler=null; $('lvl').style.width='0%'; return frames.slice(); }

// ---------- one-pass capture (pcm + pitch) ----------
let proc=null, pcm=[];
function captureUtterance(silenceEnd=1.2, maxSec=25, waitSec=7){
  return new Promise(async res=>{
    if(!await openMic()) return res({err:'not-allowed'});
    await micCtx.resume();
    const src=micCtx.createMediaStreamSource(stream);
    proc=micCtx.createScriptProcessor(4096,1,1); pcm=[];
    const mute=micCtx.createGain(); mute.gain.value=0;
    src.connect(proc); proc.connect(mute); mute.connect(micCtx.destination);
    proc.onaudioprocess=e=>{ pcm.push(new Float32Array(e.inputBuffer.getChannelData(0))); };
    startSampling(); let started=false, silent=0, loud=0, floor=null, peak=0;
    const iv=setInterval(()=>{
      const f=frames[frames.length-1]; if(!f) return;
      const el0=(performance.now()-t0)/1000;
      if(floor===null){ if(el0<0.4) return; const fs=frames.map(x=>x.rms).sort((a,b)=>a-b); floor=fs[Math.floor(fs.length/2)]||0.001; }
      const thr=Math.max(0.003, floor*3); peak=Math.max(peak,f.rms); window._lastPeak=peak; window._lastThr=thr;
      if(f.rms>thr){ loud++; if(loud>=2) started=true; silent=0; } else { loud=0; if(started) silent+=0.1; }
      const el=(performance.now()-t0)/1000;
      if((started&&silent>=silenceEnd) || el>maxSec || (!started&&el>waitSec) || stopFlag){
        clearInterval(iv); const fr=stopSampling();
        try{ proc.disconnect(); src.disconnect(); }catch(e){}
        res({frames:fr, pcm:concat(pcm), sr:micCtx.sampleRate, spoke:started, peak});
      }
    },100);
  });
}
function concat(chunks){ let n=0; for(const c of chunks) n+=c.length; const o=new Float32Array(n); let k=0; for(const c of chunks){ o.set(c,k); k+=c.length; } return o; }
function to16k(x,sr){ if(sr===16000) return x; const r=sr/16000, n=Math.floor(x.length/r), o=new Float32Array(n);
  for(let i=0;i<n;i++){ const p=i*r, j=Math.floor(p), f=p-j; o[i]=x[j]*(1-f)+(x[j+1]||0)*f; } return o; }
async function whisper(pcm16){
  let pk=0; for(let i=0;i<pcm16.length;i++){ const a=Math.abs(pcm16[i]); if(a>pk) pk=a; }
  if(pk>0 && pk<0.9){ const g=Math.min(20,0.9/pk); for(let i=0;i<pcm16.length;i++) pcm16[i]*=g; }
  const out=await window.asrPipe(pcm16,{chunk_length_s:30,stride_length_s:5});
  return (Array.isArray(out)?out.map(o=>o.text).join(' '):out.text||'').replace(/\[.*?\]|\(.*?\)/g,'').trim();
}
async function listenWhisper(long){
  $('heard').textContent='듣는 중…';
  let c= long ? await captureUtterance(2.2,70,8) : await captureUtterance();
  if(!c.err && !c.spoke && c.peak===0 && !stopFlag){ closeMic(); await new Promise(r=>setTimeout(r,300)); await beep(660);
    c= long ? await captureUtterance(2.2,70,8) : await captureUtterance(); }
  if(c.err) return {text:'',err:c.err,frames:null};
  if(!c.spoke) return {text:'',err:'no-speech',frames:c.frames};
  $('heard').textContent='분석 중…';
  const text=await whisper(to16k(c.pcm,c.sr));
  $('heard').textContent='들린 말: '+text;
  return {text, frames:c.frames};
}
function diag(r){ return '오류 코드: '+(r.err||'없음')+' · 방식: '+(asrReady()?'내장 Whisper':'크롬 음성인식('+window.asrState+')')+
  ' · 최대 음량: '+(window._lastPeak!=null?window._lastPeak.toFixed(3):'-')+' / 기준 '+(window._lastThr!=null?window._lastThr.toFixed(3):'-'); }
function asrReady(){ return window.asrState==='ready' && window.asrPipe; }

// ---------- listening ----------
function recognizeOnce(lang='en-US'){
  return new Promise(res=>{
    if(!SR){ res({text:'',err:'no-sr'}); return; }
    const r=new SR(); r.lang=lang; r.interimResults=true; r.maxAlternatives=1; r.continuous=false;
    let finalText='', interim='', settled=false, err=null;
    const fin=()=>{ if(!settled){ settled=true; clearTimeout(to); try{r.abort();}catch(e){} res({text:(finalText||interim).trim(),err}); } };
    r.onresult=e=>{ interim=''; for(let i=e.resultIndex;i<e.results.length;i++){ const t=e.results[i][0].transcript; if(e.results[i].isFinal) finalText+=t+' '; else interim+=t; }
      $('heard').textContent='들린 말: '+(finalText+interim); };
    r.onerror=e=>{ err=e.error; }; r.onend=fin;
    const to=setTimeout(()=>{ try{r.stop();}catch(e){} setTimeout(fin,800); },20000);
    try{ r.start(); }catch(e){ err='start'; fin(); }
  });
}
// pitch-only pass: wait for speech then end after 1.3 s of silence
function capturePitchOnly(){
  return new Promise(res=>{
    startSampling(); let heard=false, silent=0;
    const iv=setInterval(()=>{
      const f=frames[frames.length-1]; if(!f) return;
      if(f.rms>0.01){ heard=true; silent=0; } else if(heard){ silent+=0.1; }
      const el=(performance.now()-t0)/1000;
      if((heard&&silent>=1.3)||el>20||stopFlag){ clearInterval(iv); res(stopSampling()); }
    },100);
  });
}
async function listen(){
  if(asrReady()) return await listenWhisper(false);
  const wantPitch=$('intoOn').checked;
  if(!wantPitch){ closeMic(); const r=await recognizeOnce(); return {...r,frames:null}; }
  if(pitchMode==='concurrent'){
    if(!await openMic()) pitchMode='sequential';
    else{
      startSampling(); const r=await recognizeOnce(); const fr=stopSampling();
      const maxR=Math.max(0,...fr.map(f=>f.rms));
      if(r.err==='audio-capture'){ pitchMode='sequential'; closeMic(); return {...r,frames:null,retry:true}; }
      if(r.text && maxR<0.004){ pitchMode='sequential'; closeMic(); return {...r,frames:null}; }
      if(!r.text && maxR>0.02){ pitchMode='sequential'; closeMic(); return {...r,frames:null,retry:true}; }
      return {...r,frames:fr};
    }
  }
  closeMic(); const r=await recognizeOnce(); return {...r,frames:null};
}


// ---------- mode ----------
let mode = (seoulToday().getHours()>=15) ? 'vocab' : 'shadow';
function setMode(m){ if(running) return; mode=m;
  $('modeA').style.background= m==='shadow'?'var(--acc)':''; $('modeB').style.background= m==='vocab'?'var(--acc)':'';
  renderDay(); }
$('modeA').onclick=()=>setMode('shadow'); $('modeB').onclick=()=>setMode('vocab');
function todaysVocab(){ const n=VOCAB_DAYS.length; const k=((dayIndex())%n+n)%n; return {day:k+1, items:VOCAB_DAYS[k]}; }
function renderVocab(active){
  const v=todaysVocab();
  $('passageBox').innerHTML=`<div class="ptype">오늘의 표현 (Day ${v.day}) · 30개</div><div class="ptext">`+
    v.items.map((it,i)=>`<div class="${active===i?'cur':''}" style="padding:2px 4px">${i+1}. ${it[0]} — <span style="color:#94a3b8">${it[1].split('|')[0]}</span></div>`).join('')+'</div>';
}
// ---------- grading ----------
function koNorm(t){ return (t||'').replace(/[~.,!?'"·\s]/g,'').replace(/[A-Za-z]/g,''); }
function bigrams(t){ const o=[]; for(let i=0;i<t.length-1;i++) o.push(t.slice(i,i+2)); return o.length?o:[t]; }
function dice(a,b){ const A=bigrams(a), B=bigrams(b).slice(); let m=0; for(const x of A){ const j=B.indexOf(x); if(j>=0){ m++; B.splice(j,1);} } return 2*m/(A.length+bigrams(b).length); }
function koCorrect(answer, ko){
  const a=koNorm(answer); if(!a) return false;
  return ko.split('|').some(v=>{ const n=koNorm(v.replace(/~(으로|에서|에게|에|와|과|을|를|로|의|이|가|할)/g,'')); const core=n.replace(/(하다|이다|다)$/,'');
    return (core.length>=2 && a.includes(core)) || dice(a,n)>=0.5; });
}
function enCorrect(answer, en){
  const exp=Core.tokenize(en), got=Core.tokenize(answer); if(!got.length) return {ok:false,miss:exp};
  const miss=Core.align(exp,got).filter(d=>d.exp.length).flatMap(d=>d.exp);
  const allow = exp.length<=3 ? 0 : Math.floor(exp.length*0.15);
  return {ok: miss.length<=allow, miss};
}
// ---------- vocab drill (Web Speech only, no own mic) ----------
async function askOnce(lang){
  closeMic();
  for(let k=0;k<2 && !stopFlag;k++){
    await beep(); $('heard').textContent='듣는 중…';
    const r=await recognizeOnce(lang);
    if(r.text){ $('heard').textContent='들린 말: '+r.text; return r.text; }
    if(r.err==='not-allowed'||r.err==='no-sr'){ await say('마이크 권한이 없어요'); stopFlag=true; return ''; }
    $('fb').innerHTML='<span class="warn">못 들었어요</span><br><small>오류 코드: '+(r.err||'없음')+'</small>';
    if(k===0) await say('다시요');
  }
  return '';
}
function isCmd(t,words){ const x=(t||'').toLowerCase().replace(/[.!?\s]/g,''); return words.some(w=>x===w); }
async function runVocab(){
  const v=todaysVocab(); const items=v.items; const wrong=[];
  // round 1: EN -> KO
  for(let i=0;i<items.length && !stopFlag;i++){
    const [en,ko]=items[i]; renderVocab(i);
    $('status').textContent=`1라운드 (영어→한국어) ${i+1}/${items.length}`; $('fb').innerHTML='';
    await say(en,'en'); const ans=await askOnce('ko-KR'); if(stopFlag) break;
    if(isCmd(ans,['그만','stop'])){ stopFlag=true; break; }
    if(isCmd(ans,['다음','next','패스','pass'])){ wrong.push(i); continue; }
    if(ans && koCorrect(ans,ko)){ $('fb').innerHTML='<span class="ok">✔ 맞아요</span>'; await say('맞아요'); }
    else { wrong.push(i); $('fb').innerHTML='<span class="bad">✘ 정답: '+ko.split('|')[0]+'</span>'; await say('정답은 '+ko.split('|')[0]); }
  }
  if(stopFlag) return;
  addLog(`<span class="pill">1라운드</span>${items.length-new Set(wrong).size}/${items.length} 맞음`);
  // round 2: KO -> EN
  await say('이번엔 한국어를 듣고 영어로 말해 주세요');
  const wrong2=[];
  for(let i=0;i<items.length && !stopFlag;i++){
    const [en,ko]=items[i]; renderVocab(i);
    $('status').textContent=`2라운드 (한국어→영어) ${i+1}/${items.length}`; $('fb').innerHTML='';
    await say(ko.split('|')[0]); const ans=await askOnce('en-US'); if(stopFlag) break;
    if(isCmd(ans,['그만','stop'])){ stopFlag=true; break; }
    if(isCmd(ans,['다음','next','패스','pass'])){ wrong2.push(i); continue; }
    const g=enCorrect(ans,en);
    if(g.ok){ $('fb').innerHTML='<span class="ok">✔ 좋아요</span>'; await say('좋아요'); }
    else { wrong2.push(i); $('fb').innerHTML='<span class="bad">✘ 정답: '+en+'</span>'+(g.miss.length&&ans?'<br>빠진/틀린 말: '+g.miss.join(' '):'');
      await say('정답은'); await say(en,'en',0.75); }
  }
  if(stopFlag) return;
  addLog(`<span class="pill">2라운드</span>${items.length-wrong2.length}/${items.length} 맞음`);
  // review: items missed in round 2, once more
  if(wrong2.length){
    await say(`틀린 ${wrong2.length}개만 한 번 더 할게요`);
    for(const i of wrong2){ if(stopFlag) break; const [en,ko]=items[i]; renderVocab(i);
      $('status').textContent='복습 (한국어→영어)'; $('fb').innerHTML='';
      await say(ko.split('|')[0]); const ans=await askOnce('en-US'); if(stopFlag) break;
      if(enCorrect(ans,en).ok) await say('좋아요'); else { await say('정답은'); await say(en,'en',0.75); }
    }
    addLog('<b>오늘 어려웠던 표현:</b> '+wrong2.map(i=>items[i][0]).join(', '));
  }
  await say('오늘 표현 연습 끝이에요. 수고하셨어요 치윤님');
}

// ---------- practice loop ----------
function addLog(html){ logLines.unshift(html); $('log').innerHTML=logLines.slice(0,40).join('<br>'); }
async function practiceSentence(sentence,pi,si){
  const maxTry=parseInt($('maxTry').value); let noHear=0;
  for(let attempt=1; attempt<=maxTry && !stopFlag; attempt++){
    renderPassages({p:pi,s:si});
    $('status').textContent=`지문 ${pi+1} · 문장 ${si+1} · ${attempt}번째`; $('fb').innerHTML='';
    await say(sentence,'en'); if(stopFlag) return;
    await beep(); $('heard').textContent='듣는 중…';
    let r=await listen(); if(stopFlag) return;
    if(r.retry){ r=await listen(); }
    const cmd=(r.text||'').toLowerCase().trim();
    if(/^(next|skip)\b/.test(cmd)) { await say('다음 문장으로 갈게요'); return; }
    if(/^stop\b/.test(cmd)) { stopFlag=true; return; }
    if(!r.text){
      if(r.err==='not-allowed'||r.err==='no-sr'){ await say('마이크 권한이 없어서 들을 수 없어요. 크롬에서 마이크를 허용해 주세요'); stopFlag=true; return; }
      $('fb').innerHTML='<span class="warn">못 들었어요</span><br><small>'+diag(r)+'</small>'; noHear++;
      if(noHear>=2){ await say('소리가 안 들려서 다음 문장으로 갈게요'); return; }
      await say('잘 못 들었어요. 다시 해 볼게요'); attempt--; continue;
    }
    // words
    const diffs=Core.align(Core.tokenize(sentence),Core.tokenize(r.text));
    const wordMsgs=[]; const spoken=[];
    for(const d of diffs.slice(0,2)){
      const exp=d.exp.join(' '), got=d.got.join(' ');
      if(exp){ hardWords[exp]=(hardWords[exp]||0)+1; }
      if(exp && got){ const tip=Core.soundTip(d.exp.join(''),d.got.join(''));
        wordMsgs.push(`<b>${exp}</b> → ${got}`); spoken.push(['en',exp],['ko', '가 '],['en',got],['ko','처럼 들렸어요. '+(tip?tip+'.':'')]); }
      else if(exp){ wordMsgs.push(`<b>${exp}</b> 빠짐`); spoken.push(['en',exp],['ko','를 빠뜨렸어요.']); }
      else { wordMsgs.push(`추가로 들림: ${got}`); }
    }
    const wordsOk = diffs.filter(d=>d.exp.length).length===0;
    // intonation
    let into={endOk:null,msgs:[]};
    if($('intoOn').checked){
      let fr=r.frames;
      if(!fr && wordsOk){ // sequential mode: separate pitch pass
        await say('단어는 좋아요. 이번엔 억양만 볼게요. 한 번 더 읽어 주세요');
        if(await openMic()){ await beep(); fr=await capturePitchOnly(); closeMic(); }
      }
      if(fr) into=Core.judgeIntonation(sentence,Core.analyzePitch(fr));
    }
    const intoOk = into.endOk!==false;
    const html=[];
    html.push(wordsOk?'<span class="ok">✔ 단어 정확</span>':'<span class="bad">✘ '+wordMsgs.join(', ')+'</span>');
    if(into.endOk===true) html.push('<span class="ok">✔ 끝 억양 좋음</span>');
    if(into.msgs.length) html.push('<span class="warn">'+into.msgs.join(' / ')+'</span>');
    $('fb').innerHTML=html.join('<br>');
    if(wordsOk && intoOk){
      addLog(`<span class="pill">${pi+1}-${si+1}</span><span class="ok">${attempt}번 만에 통과</span>`);
      await say(into.msgs.length? '단어 좋아요. '+into.msgs[0] : '좋아요'); return;
    }
    if(!wordsOk){ await sayParts(spoken.slice(0,8)); for(const d of diffs.filter(d=>d.exp.length).slice(0,2)) await say(d.exp.join(' '),'en',0.7); }
    if(!intoOk) await say(into.msgs[0]);
    if(attempt<maxTry) await say('다시');
    else { addLog(`<span class="pill">${pi+1}-${si+1}</span><span class="bad">넘어감: ${wordMsgs.join(', ')||into.msgs[0]||''}</span>`);
      await say('다음 문장으로 갈게요'); }
  }
}
async function run(){
  running=true; stopFlag=false; $('startBtn').textContent='■ 그만'; $('startBtn').classList.add('stop');
  audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); await audioCtx.resume();
  try{ wakeLock=await Promise.race([navigator.wakeLock.request('screen'), new Promise(r=>setTimeout(()=>r(null),1500))]); }catch(e){}
  if(mode==='vocab'){ if(!SR){ await say('크롬으로 열어 주세요'); return finish(); } await runVocab(); return finish(); }
  if(window.asrState==='loading'){ $('status').textContent='음성인식 모델 준비 중…'; await say('음성인식 준비 중이에요. 잠시만요');
    const w0=performance.now(); while(window.asrState==='loading' && performance.now()-w0<180000 && !stopFlag) await new Promise(r=>setTimeout(r,500)); }
  if(!asrReady() && !SR){ await say('이 브라우저는 음성 인식을 지원하지 않아요. 크롬으로 열어 주세요'); return finish(); }
  if((asrReady() || ($('intoOn').checked && pitchMode==='concurrent')) && !await openMic()) { await say('마이크를 허용해 주세요'); }
  const ps=todaysPassages();
  for(let pi=0; pi<ps.length && !stopFlag; pi++){
    const ss=Core.splitSentences(ps[pi].text);
    const tname=ps[pi].type.replace(/\s*\(.*\)/,'');
    await say(pi===0 ? `오늘은 ${tname}이에요` : `다음은 ${tname}이에요`);
    for(let si=0; si<ss.length && !stopFlag; si++) await practiceSentence(ss[si],pi,si);
    if(stopFlag) break;
    await say('이제 전체를 이어서 읽어 볼게요');
    await say(ps[pi].text,'en'); await beep();
    $('status').textContent=`지문 ${pi+1} 전체 읽기`; $('heard').textContent='듣는 중…';
    const whole=await listenLong(); if(stopFlag) break;
    const diffs=Core.align(Core.tokenize(ps[pi].text),Core.tokenize(whole));
    const miss=diffs.filter(d=>d.exp.length).map(d=>d.exp.join(' '));
    addLog(`<span class="pill">지문${pi+1} 전체</span>${miss.length?'<span class="warn">흐린 단어: '+miss.slice(0,6).join(', ')+'</span>':'<span class="ok">단어 모두 인식됨</span>'}`);
    await say(miss.length? `전체 읽기에서 ${miss.length}군데가 흐렸어요.` : '전체 읽기 좋았어요.');
  }
  const top=Object.entries(hardWords).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]);
  if(top.length){ await say('오늘 자주 틀린 단어는'); for(const w of top) await say(w,'en',0.75); await say('이에요. 수고하셨어요 치윤님'); }
  else await say('오늘 따라읽기 끝이에요. 수고하셨어요 치윤님');
  if(top.length) addLog('<b>오늘 약점:</b> '+top.join(', '));
  finish();
}
// whole-passage read: keep restarting recognition until 2.5 s with no new words or 60 s
async function listenLong(){
  if(asrReady()){ const r=await listenWhisper(true); return r.text||''; }
  closeMic(); let all=''; const start=performance.now();
  while(!stopFlag && performance.now()-start<60000){
    const r=await recognizeOnce(); if(!r.text){ if(all) break; else continue; }
    all+=' '+r.text; if(/\b(stop)$/i.test(r.text.trim())){ stopFlag=true; break; }
  }
  return all.trim();
}
function finish(){
  running=false; speechSynthesis.cancel(); closeMic(); clearInterval(sampler);
  try{ wakeLock&&wakeLock.release(); }catch(e){} wakeLock=null;
  $('startBtn').textContent='▶ 시작'; $('startBtn').classList.remove('stop'); $('status').textContent='끝'; if(mode==='vocab') renderVocab(); else renderPassages();
}
$('startBtn').onclick=()=>{ if(running){ stopFlag=true; speechSynthesis.cancel(); $('status').textContent='멈추는 중…'; } else run().catch(e=>{ $('fb').textContent='오류: '+e.message; finish(); }); };
document.addEventListener('visibilitychange',async()=>{ if(running&&document.visibilityState==='visible'){ try{ wakeLock=await Promise.race([navigator.wakeLock.request('screen'), new Promise(r=>setTimeout(()=>r(null),1500))]); }catch(e){} } });
$('micTest').onclick=async()=>{
  if(running) return; closeMic();
  $('status').textContent='마이크 시험: 영어로 한 문장 말해 보세요'; $('heard').textContent='듣는 중…'; $('fb').textContent='';
  const ua=navigator.userAgent.match(/Chrome\/[\d]+/);
  audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); await audioCtx.resume();
  const r= asrReady() ? await listenWhisper(false) : await recognizeOnce();
  if(!asrReady()) closeMic();
  $('status').textContent= r.text ? '마이크 정상' : '못 들음';
  $('fb').innerHTML= (r.text? '<span class="ok">들린 말: '+r.text+'</span>' : '<span class="bad">아무것도 못 들었어요</span>')+
    '<br>'+diag(r)+' · '+(ua?ua[0]:'');
};
setMode(mode);
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{}); }
// auto start (?auto=1 or installed app): browsers may block sound until one tap
(async function autoStart(){
  if(!/[?&]auto=1/.test(location.search)) return;
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  try{ await Promise.race([audioCtx.resume(), new Promise(r=>setTimeout(r,800))]); }catch(e){}
  const tapStart=()=>{ $('tapAll').style.display='none'; if(!running) run().catch(e=>{ $('fb').textContent='오류: '+e.message; finish(); }); };
  if(audioCtx.state==='running'){
    // probe speech: if blocked, ask for one tap
    let blocked=false; const u=new SpeechSynthesisUtterance('시작할게요'); u.lang='ko-KR';
    const ok=await new Promise(res=>{ u.onstart=()=>res(true); u.onerror=e=>res(false); setTimeout(()=>res(false),2500); speechSynthesis.speak(u); });
    if(ok){ setTimeout(tapStart,900); return; }
    speechSynthesis.cancel();
  }
  $('tapAll').style.display='flex';
  $('tapAll').addEventListener('click',async()=>{ await audioCtx.resume(); tapStart(); },{once:true});
})();
</script>
